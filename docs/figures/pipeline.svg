<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="880" viewBox="0 0 1180 880" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrow0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/></marker><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F855A"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B6CB0"/></marker><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C05621"/></marker><marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B46C1"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="40" width="480" height="760" rx="12" fill="#FAFAFB" stroke="#D1D5DB" stroke-width="1"/><text x="36" y="64" font-size="11" font-weight="bold" text-anchor="start" fill="#4B5563" letter-spacing="1.2">OFFLINE · RUN ONCE</text><rect x="620" y="40" width="480" height="760" rx="12" fill="#FAFAFB" stroke="#D1D5DB" stroke-width="1"/><text x="636" y="64" font-size="11" font-weight="bold" text-anchor="start" fill="#4B5563" letter-spacing="1.2">ONLINE · PER QUERY FORMULA</text><rect x="40" y="80" width="440" height="66" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/><text x="260.0" y="101.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">ARQMath collection</text><text x="260.0" y="118.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">28.3M formula instances from Math Stack Exchange, 2010–2018</text><text x="260.0" y="135.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">LaTeX, SLT and OPT (MathML via LaTeXML)</text><rect x="40" y="175" width="440" height="66" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/><text x="260.0" y="196.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Formula index</text><text x="260.0" y="213.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">MathML sanitised (unclosed tags, raw &amp; and &lt;)</text><text x="260.0" y="230.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">issue flags: deleted formulas never returned</text><rect x="40" y="270" width="440" height="66" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/><text x="260.0" y="291.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Visual index</text><text x="260.0" y="308.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">one representative per visually distinct formula</text><text x="260.0" y="325.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">8.4M retrievable visual IDs</text><rect x="40" y="365" width="210" height="66" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/><text x="145.0" y="386.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Graph store</text><text x="145.0" y="403.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">SLT + OPT graphs, typed edges</text><text x="145.0" y="420.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">≤256 nodes, 20k-symbol vocab</text><rect x="270" y="365" width="210" height="66" rx="8" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="375.0" y="386.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">BM25 index</text><text x="375.0" y="403.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">SLT symbol unigrams + bigrams</text><text x="375.0" y="420.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">k1 = 1.2, b = 0.75</text><rect x="40" y="470" width="210" height="66" rx="8" fill="#F1ECFB" stroke="#6B46C1" stroke-width="1.5"/><text x="145.0" y="491.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Contrastive pretraining</text><text x="145.0" y="508.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">8.4M formulas, 2 views each</text><text x="145.0" y="525.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">InfoNCE, in-batch negatives</text><rect x="270" y="470" width="210" height="66" rx="8" fill="#E8F6EE" stroke="#2F855A" stroke-width="1.5"/><text x="375.0" y="491.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Relevance judgments</text><text x="375.0" y="508.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">ARQMath-1 (development)</text><text x="375.0" y="525.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">ARQMath-1 + 2 (final models)</text><rect x="40" y="575" width="210" height="66" rx="8" fill="#F1ECFB" stroke="#6B46C1" stroke-width="1.5"/><text x="145.0" y="596.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Supervised fine-tuning</text><text x="145.0" y="613.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">judged positives, hard negatives</text><text x="145.0" y="630.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">then encode all 8.4M (256-d)</text><rect x="270" y="575" width="210" height="66" rx="8" fill="#FDF0E6" stroke="#C05621" stroke-width="1.5"/><text x="375.0" y="596.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Reranker training</text><text x="375.0" y="613.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">judged pairs, 48 features</text><text x="375.0" y="630.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">pairwise logistic regression</text><path d="M 260.0 146 L 260.0 175" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 260.0 241 L 260.0 270" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 260.0 336 L 260.0 350 L 145.0 350 L 145.0 365" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 260.0 350 L 375.0 350 L 375.0 365" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 145.0 431 L 145.0 470" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 115.0 536 L 115.0 575" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 325.0 536 L 325.0 555 L 195.0 555 L 195.0 575" fill="none" stroke="#2F855A" stroke-width="1.6" marker-end="url(#arrow1)" stroke-linejoin="round"/><path d="M 415.0 536 L 415.0 575" fill="none" stroke="#2F855A" stroke-width="1.6" marker-end="url(#arrow1)" stroke-linejoin="round"/><rect x="640" y="270" width="440" height="66" rx="8" fill="#E8F6EE" stroke="#2F855A" stroke-width="1.5"/><text x="860.0" y="291.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Topic formula</text><text x="860.0" y="308.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">official SLT + OPT of the query formula</text><text x="860.0" y="325.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">dev: ARQMath-2 · test: ARQMath-3</text><rect x="640" y="365" width="210" height="66" rx="8" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="745.0" y="386.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">BM25 search</text><text x="745.0" y="403.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">sparse retrieval</text><text x="745.0" y="420.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">top 1,000</text><rect x="870" y="365" width="210" height="66" rx="8" fill="#F1ECFB" stroke="#6B46C1" stroke-width="1.5"/><text x="975.0" y="386.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Dense GNN search</text><text x="975.0" y="403.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">exact inner product</text><text x="975.0" y="420.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">top 1,000</text><rect x="640" y="470" width="440" height="66" rx="8" fill="#FDF0E6" stroke="#C05621" stroke-width="1.5"/><text x="860.0" y="499.5" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Reciprocal rank fusion</text><text x="860.0" y="517.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">score = Σ 1 / (60 + rank)</text><rect x="640" y="575" width="440" height="66" rx="8" fill="#FDF0E6" stroke="#C05621" stroke-width="1.5"/><text x="860.0" y="596.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Structural reranker</text><text x="860.0" y="613.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">reorders the top 300: symbol pairs, paths, tree edit distance,</text><text x="860.0" y="630.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">BM25 and pretrained-GNN scores</text><rect x="640" y="680" width="440" height="66" rx="8" fill="#E8F6EE" stroke="#2F855A" stroke-width="1.5"/><text x="860.0" y="701.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Ranked list → evaluation</text><text x="860.0" y="718.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">deduplicated by visual ID; prime nDCG′, MAP′, P′@10</text><text x="860.0" y="735.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">paired randomization tests</text><path d="M 860.0 336 L 860.0 350 L 745.0 350 L 745.0 365" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 860.0 350 L 975.0 350 L 975.0 365" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 745.0 431 L 745.0 450 L 860.0 450" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-linejoin="round"/><path d="M 975.0 431 L 975.0 450 L 860.0 450 L 860.0 470" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 860.0 536 L 860.0 575" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 860.0 641 L 860.0 680" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 480 398.0 L 640 398.0" fill="none" stroke="#2B6CB0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow2)" stroke-linejoin="round"/><rect x="539.6" y="380.0" width="40.800000000000004" height="17" rx="3" fill="white"/><text x="560.0" y="391.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#2B6CB0" font-style="italic">index</text><path d="M 480 608.0 L 640 608.0" fill="none" stroke="#C05621" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow3)" stroke-linejoin="round"/><rect x="514.96" y="590.0" width="90.08000000000001" height="17" rx="3" fill="white"/><text x="560.0" y="601.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#C05621" font-style="italic">trained model</text><path d="M 145.0 641 L 145.0 822 L 1135 822 L 1135 398.0 L 1080 398.0" fill="none" stroke="#6B46C1" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow4)" stroke-linejoin="round"/><rect x="428.71999999999997" y="815" width="262.56000000000006" height="17" rx="3"