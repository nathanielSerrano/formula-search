<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrow0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="30" y="70" width="190" height="90" rx="8" fill="#E8F6EE" stroke="#2F855A" stroke-width="1.5"/><text x="125.0" y="103.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">1 · Train</text><text x="125.0" y="120.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">models fit on ARQMath-1</text><text x="125.0" y="137.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">74 judged topics</text><rect x="265" y="70" width="190" height="90" rx="8" fill="#E8F6EE" stroke="#2F855A" stroke-width="1.5"/><text x="360.0" y="103.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">2 · Develop</text><text x="360.0" y="120.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">all choices made on ARQMath-2</text><text x="360.0" y="137.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">58 topics; reranker 5-fold CV</text><rect x="500" y="70" width="190" height="90" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/><text x="595.0" y="103.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">3 · Freeze</text><text x="595.0" y="120.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">encoder, fine-tune step 250,</text><text x="595.0" y="137.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">RRF k = 60, reranker setting</text><rect x="735" y="70" width="190" height="90" rx="8" fill="#F1ECFB" stroke="#6B46C1" stroke-width="1.5"/><text x="830.0" y="103.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">4 · Retrain</text><text x="830.0" y="120.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">same settings on</text><text x="830.0" y="137.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">ARQMath-1 + 2 (144 topics)</text><rect x="970" y="70" width="190" height="90" rx="8" fill="#FDF0E6" stroke="#C05621" stroke-width="1.5"/><text x="1065.0" y="103.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">5 · Test once</text><text x="1065.0" y="120.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">ARQMath-3, 76 topics</text><text x="1065.0" y="137.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">official cross-check</text><path d="M 220 115 L 265 115" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 455 115 L 500 115" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 690 115 L 735 115" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><path d="M 925 115 L 970 115" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><text x="590" y="40" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F2937">Experimental protocol: every setting is fixed before ARQMath-3 is used.</text><text x="1065" y="192" font-size="11" font-weight="normal" text-anchor="middle" fill="#4B5563" font-style="italic">Nothing downstream of step 3</text><text x="1065" y="209" font-size="11" font-weight="normal" text-anchor="middle" fill="#4B5563" font-style="italic">is tuned again; the test run</text><text x="1065" y="226" font-size="11" font-weight="normal" text-anchor="middle" fill="#4B5563" font-style="italic">was evaluated a single time.</text><text x="30" y="210" font-size="11.5" font-weight="normal" text-anchor="start" fill="#4B5563">Why ARQMath-1 + 2 for the final models: dev has done its job once settings are frozen, and</text><text x="30" y="228" font-size="11.5" font-weight="normal" text-anchor="start" fill="#4B5563">144 training topics instead of 74 is the standard last step before a single test evaluation.</text><text x="30" y="258" font-size="11.5" font-weight="normal" text-anchor="start" fill="#4B5563">Collection pretraining (no labels) uses all 8.4M corpus formulas; no ARQMath-3 judgments enter any stage.</text></svg>
