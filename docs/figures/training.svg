="200" height="76" rx="8" fill="#E8F6EE" stroke="#2F855A" stroke-width="1.5"/><text x="725.0" y="196.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Positive</text><text x="725.0" y="213.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">formula graded 2–3</text><text x="725.0" y="230.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">for the same topic</text><path d="M 825 208 L 865 208" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><rect x="625" y="270" width="200" height="76" rx="8" fill="#E8F6EE" stroke="#2F855A" stroke-width="1.5"/><text x="725.0" y="296.25" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Hard negative</text><text x="725.0" y="313.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">formula judged 0–1</text><text x="725.0" y="330.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">for the same topic</text><path d="M 825 308 L 865 308" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><rect x="865" y="70" width="110" height="276" rx="8" fill="#F1ECFB" stroke="#6B46C1" stroke-width="1.5"/><text x="920.0" y="179.75" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Encoder</text><text x="920.0" y="197.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">initialised</text><text x="920.0" y="213.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">from the</text><text x="920.0" y="230.25" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">pretrained</text><text x="920.0" y="246.75" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#4B5563">model</text><rect x="1010" y="140" width="130" height="136" rx="8" fill="#F1ECFB" stroke="#6B46C1" stroke-width="1.5"/><text x="1075.0" y="181.75" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Loss</text><text x="1075.0" y="198.25" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#4B5563">each anchor vs.</text><text x="1075.0" y="213.75" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#4B5563">all positives and</text><text x="1075.0" y="229.25" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#4B5563">negatives in</text><text x="1075.0" y="244.75" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#4B5563">the batch (2B)</text><path d="M 975 208 L 1010 208" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow0)" stroke-linejoin="round"/><text x="880" y="385" font-size="11" font-weight="normal" text-anchor="middle" fill="#4B5563" font-style="italic">B = 64 distinct topics per batch, one example each, so no in-batch false negatives.</text><text x="880" y="405" font-size="11" font-weight="normal" text-anchor="middle" fill="#4B5563" font-style="italic">600-step schedule, lr 5e-5; development stops at step 250 (chosen by quick dev MAP′).</text><text x="880" y="425" font-size="11" font-weight="normal" text-anchor="middle" fill="#4B5563" font-style="italic">Development: ARQMath-1 (74 topics). Final model: ARQMath-1 + 2 (144 topics).</text></svg>
